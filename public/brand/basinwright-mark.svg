<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="BasinWright">
  <title>BasinWright</title>
  <desc>Fluent Grid Dots with three dots lit — compute, data and intelligence — tracing a check mark across the lattice.</desc>
  <style>
    .grid { fill: #aab2bf }
    .compute { fill: #0067b8 }
    .data { fill: #038387 }
    .intelligence { fill: #107c10 }
    @media (prefers-color-scheme: dark) {
      .grid { fill: #45506b }
      .compute { fill: #6bb8f5 }
      .data { fill: #40e6c7 }
      .intelligence { fill: #9ef259 }
    }
  </style>

  <!-- The estate: raw, unresolved, always running. Fluent's regular weight. -->
  <g class="grid">
    <circle cx="5" cy="5" r="1.5"/>
    <circle cx="12" cy="5" r="1.5"/>
    <circle cx="12" cy="12" r="1.5"/>
    <circle cx="19" cy="12" r="1.5"/>
    <circle cx="5" cy="19" r="1.5"/>
    <circle cx="19" cy="19" r="1.5"/>
  </g>

  <!-- What we light up, in the order the substrate resolves it. Filled weight,
       so the three lead the lattice at any size. The three positions trace a
       check mark: down to the vertex, then up and away. -->
  <circle class="compute" cx="5" cy="12" r="2"/>
  <circle class="data" cx="12" cy="19" r="2"/>
  <circle class="intelligence" cx="19" cy="5" r="2"/>
</svg>
