<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 24" width="168" height="24" role="img" aria-label="BasinWright">
  <title>BasinWright</title>
  <desc>Horizontal lockup for dark surfaces: the mark, then the wordmark.</desc>

  <g fill="#45506b">
    <circle cx="5" cy="5" r="1.5"/>
    <circle cx="12" cy="5" r="1.5"/>
    <circle cx="12" cy="12" r="1.5"/>
    <circle cx="19" cy="12" r="1.5"/>
    <circle cx="5" cy="19" r="1.5"/>
    <circle cx="19" cy="19" r="1.5"/>
  </g>
  <circle fill="#6bb8f5" cx="5" cy="12" r="2"/>
  <circle fill="#40e6c7" cx="12" cy="19" r="2"/>
  <circle fill="#9ef259" cx="19" cy="5" r="2"/>

  <text x="32" y="12" dominant-baseline="central" fill="#ffffff"
        font-family="Segoe UI Variable Display, Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="17" letter-spacing="-0.35">BasinWright</text>
